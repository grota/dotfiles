[plugins]
enabled = [ "goodroot/noctwhspr", "grota/command-label", "grota/niri-position" ]

[shell]
clipboard_confirm_clear_history = false
niri_overview_type_to_launch_enabled = true

[theme]
builtin = "Ayu"
community_palette = "Occult Umbral"
mode = "light"
source = "wallpaper"
wallpaper_scheme = "m3-content"

    [theme.templates.user.noctwhspr_mic_osd]
    input_path = "/home/grota/.config/noctalia/templates/noctwhspr-mic-osd.css"
    output_path = "/home/grota/.config/hyprwhspr/theme/mic-osd.css"

[wallpaper]
directory = "/home/grota/Downloads/walls-main"

    [wallpaper.default]
    path = "/home/grota/Downloads/walls-main/architecture/a_narrow_street_with_shops_and_signs.png"

    [wallpaper.last]
    path = "/home/grota/Downloads/walls-main/architecture/a_narrow_street_with_shops_and_signs.png"

    [wallpaper.monitors.eDP-1]
    path = "/home/grota/Downloads/walls-main/architecture/a_narrow_street_with_shops_and_signs.png"

[widget.bluetooth]
capsule = true
capsule_fill = "primary"
capsule_foreground = "on_secondary"

[widget.clip_text]
command = "cat \"$XDG_RUNTIME_DIR/clip-notify/last\" 2>/dev/null"
glyph = "clipboard"
interval = 60
max_chars = 40
type = "grota/command-label:label"

[widget.clock]
format = "{:%H:%M | %d %B  (%A)}"

    [widget.clock.actions]
    scroll_down = "exec niri msg action focus-workspace-down"
    scroll_up = "exec niri msg action focus-workspace-up"

[widget.control-center]
capsule = true
capsule_fill = "surface_variant"
color = "#037800"
glyph = "settings"

    [widget.control-center.actions]
    right = "settings-toggle"

[widget.label]
color = "primary"
command = "cat \"$XDG_RUNTIME_DIR/clip-notify/last\" 2>/dev/null"
type = "grota/command-label:label"

[widget.network]
scale = 1.4000000000000001
show_label = false

[widget.notifications]
anchor = false
scale = 1.1500000000000001

[widget.power_profile]
scale = 1.25

[widget.session]
capsule = true
capsule_fill = "on_primary"

[widget.wallpaper]
enabled = false

[widget.workspaces]
enabled = false
