[backdrop]
blur_intensity = 0.99999997764825821
tint_intensity = 0.0099999997764825821

[bar.default]
center = [ "clock" ]
end = [ "clip_text", "notifications", "clipboard", "bluetooth", "group:g4", "group:g3", "control-center", "session" ]
position = "top"
reserve_space = true
smart_auto_hide = false
start = [ "wallpaper", "workspaces", "tray", "network", "media" ]
thickness = 40

    [bar.default.dead_zone.actions]
    scroll_down = "exec niri msg action focus-column-right"
    scroll_right = "none"
    scroll_up = "exec niri msg action focus-column-left"

    [[bar.default.capsule_group]]
    accordion = false
    accordion_direction = "end"
    border = ""
    border_width = 1.0
    enabled = true
    fill = "outline"
    id = "g1"
    members = [ "power_profile", "battery" ]
    opacity = 1.0
    padding = 6.0

    [[bar.default.capsule_group]]
    accordion = false
    accordion_direction = "end"
    border_width = 1.0
    enabled = true
    fill = "outline"
    id = "g2"
    members = [ "brightness", "output_volume" ]
    opacity = 1.0
    padding = 6.0

    [[bar.default.capsule_group]]
    accordion = false
    accordion_direction = "end"
    border_width = 1.0
    enabled = true
    fill = "surface_variant"
    id = "g3"
    members = [ "power_profile", "battery" ]
    opacity = 1.0
    padding = 6.0

    [[bar.default.capsule_group]]
    accordion = false
    accordion_direction = "end"
    border_width = 1.0
    enabled = true
    fill = "surface_variant"
    id = "g4"
    members = [ "volume", "brightness" ]
    opacity = 1.0
    padding = 6.0

